name: Build Pi and spectator

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spectator:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spectator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: spectator/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/package-release.mjs
      - run: tar -czf race-track-spectator.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: spectator
          path: spectator/race-track-spectator.tar.gz
          if-no-files-found: error

  pi:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsdl2-dev libcurl4-openssl-dev
      - name: Configure
        shell: bash
        run: |
          VERSION="0.1.1-dev.${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRACE_TRACK_VERSION="$VERSION"
      - run: cmake --build build -j 4
      - run: ctest --test-dir build --output-on-failure
      - name: Package Pi application
        run: |
          mkdir -p release
          cp build/race_track release/
          cp README.md release/
          cp -r docs release/
          tar -czf race-track-pi-linux-arm64.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: pi-linux-arm64
          path: race-track-pi-linux-arm64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git zip mingw-w64-i686-gcc mingw-w64-i686-cmake
            mingw-w64-i686-ninja mingw-w64-i686-SDL2 mingw-w64-i686-curl
      - name: Configure
        run: |
          VERSION="0.1.1-dev.${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRACE_TRACK_VERSION="$VERSION"
      - run: cmake --build build -j 4
      - run: ctest --test-dir build --output-on-failure
      - name: Package Windows application
        run: |
          mkdir -p release
          cp build/race_track.exe release/
          # Bundle the transitive MinGW DLLs used by this executable.
          ldd build/race_track.exe | awk '/\/mingw32\/bin\// { print $3 }' | while read -r dll; do cp "$dll" release/; done
          cp README.md release/
          cp -r docs release/
          cd release
          zip -r ../race-track-pi-windows-x86.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: pi-windows-x86
          path: race-track-pi-windows-x86.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [spectator, pi, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish versioned build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.zip SHA256SUMS --title "Race Track Pi $RELEASE_TAG" --generate-notes
