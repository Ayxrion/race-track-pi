# Run this file on the Proxmox VM instead of compose.yaml.
# No inbound ports are published on the VM or home router.
services:
  race:
    build: .
    restart: unless-stopped
    environment:
      RACE_PUBLISH_TOKEN: ${RACE_PUBLISH_TOKEN:?Set a random publishing token in .env}
      RACE_PI_PUBLISH_TOKEN: ${RACE_PI_PUBLISH_TOKEN:-}
    expose: ["8787"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      - race
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare-tunnel-token.txt
